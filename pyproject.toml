[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-rag"
version = "0.3.0"
description = "Project-scoped datasheet RAG and evidence-backed KiCad design review"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11,<0.12", "numpy>=2,<3", "httpx>=0.28,<0.29", "pydantic>=2.10,<3", "defusedxml>=0.7,<0.8", "sexpdata>=1.0,<2", "pypdf>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "PyYAML>=6,<7"]
local-models = ["sentence-transformers>=5,<6"]
rerank = ["sentence-transformers>=5,<6"]

[project.scripts]
kicad-rag = "kicad_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
